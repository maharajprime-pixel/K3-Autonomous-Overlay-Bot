name: Build K3 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract ZIP
        run: |
          unzip -q K3-Autonomous-Overlay-Bot-GitHub-Ready.zip -d project

      - name: Build APK
        run: gradle -p project/android-app assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K3OverlayBot-APK
          path: project/android-app/app/build/outputs/apk/debug/app-debug.apk
